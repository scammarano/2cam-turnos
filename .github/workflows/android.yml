name: Turnos APK · build and Android tests
on:
  push:
    branches: [main]
    paths: ['android/**', 'native-core/**', 'docs/APK_LOCAL.md', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: turnos-local-test-signing-v1
      - name: Test authority, build APK and lint
        working-directory: android
        run: gradle --no-daemon :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Verify Android package, minimum API and certificate
        run: |
          mkdir -p delivery test-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/2cam-turnos-0.2.0-local-test.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk test-apks/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 22 delivery/*.apk | tee delivery/ANDROID_CERTIFICATE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging delivery/*.apk | tee delivery/APK_METADATA.txt
          grep -q "name='services.twocam.turnos'" delivery/APK_METADATA.txt
          grep -q "sdkVersion:'22'" delivery/APK_METADATA.txt
          cp docs/APK_LOCAL.md delivery/LEEME.md
          cd delivery
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: turnos-apk-candidate
          path: delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: turnos-instrumentation-apk
          path: test-apks/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turnos-build-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            native-core/build/reports/tests/test/
          if-no-files-found: ignore
  android-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [22, 29]
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: turnos-apk-candidate
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: turnos-instrumentation-apk
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native host and tablet operations on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r delivery/2cam-turnos-0.2.0-local-test.apk
            adb install -r test-apks/app-debug-androidTest.apk
            adb shell am instrument -w services.twocam.turnos.test/services.twocam.turnos.TurnosInstrumentation | tee /tmp/turnos-instrumentation.txt
            grep -q TURNOS_ANDROID_PASS /tmp/turnos-instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turnos-device-verification-api-${{ matrix.api }}
          path: /tmp/turnos-instrumentation.txt
          if-no-files-found: ignore
  publish:
    needs: [build, android-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: turnos-local-apk-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: turnos-apk-candidate
          path: delivery
      - name: Publish tested APK, never overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-local-test >/dev/null 2>&1; then
            echo 'Release exists; its APK is immutable.'
          else
            gh release create v0.2.0-local-test delivery/* --target "$GITHUB_SHA" --prerelease --title '2Cam Turnos 0.2.0 · APK local Fire + tablet' --notes-file docs/APK_LOCAL.md
          fi
